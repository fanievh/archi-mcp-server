# =============================================================================
# arch-mcp-server CI  (Track-1 CI safety-net)
#
# WHAT THIS DOES
#   Provisions an Archi headless runtime on a Linux GitHub runner and invokes the
#   headless harness (tools/run-tests.sh) UNMODIFIED on every push / PR. A
#   non-quarantined test failure makes the build go red before it can merge.
#
# TWO TEST LANES, PLUS PURE-SHELL GUARDS
#   The two lanes below run the suite. Two further jobs run no tests at all and need
#   no Archi, JDK or display — ci-ratchet (facade no-growth) and ci-sync (a generated
#   copy still matches its source). They are separate checks for the same reason the
#   lanes are: a failure in one must not be masked by an unrelated failure in another.
#
#   Lane 1 — ci-junit  (ACTIVE): the pure-JUnit headless bucket — every *Test.java
#            MINUS tools/osgi-excluded-tests.txt. No display needed → no xvfb.
#   Lane 2 — ci-pde    (ACTIVE): the "Group B" SWT-display classes from
#            tools/osgi-excluded-tests.txt, run under xvfb via the UNMODIFIED
#            harness (tools/run-tests.sh) in explicit-FQCN mode. This lane DERIVES
#            its class list from the manifest's "Group B" block at run time, so it
#            can never drift from the set ci-junit subtracts — add a display class
#            to the manifest and it is picked up here automatically.
#            The "Group A" OSGi/Archi-runtime classes remain DEFERRED: the
#            provisioned Archi RCP ships NO PDE JUnit runtime bundles (no
#            org.eclipse.pde.junit.runtime / jdt.junit*.runtime / org.junit), so a
#            headless `coretestapplication` would need extra bundle provisioning
#            that was judged not worth it; those stay owner-gated via the Eclipse
#            AllPluginTestsRunner. Do NOT add xvfb or OSGi machinery to ci-junit
#            (it stays the no-display pure-JUnit lane).
#
#   WHY BOTH LANES MUST BE GREEN: the two lanes are separate GitHub checks. If one
#   lane is chronically red for an unrelated reason, a genuine NEW failure in the
#   OTHER lane no longer changes the overall status and is easily dismissed as
#   "the build is always red." Keep both lanes green so a red means a regression.
#
# ACTION PIN POLICY  (read before bumping an actions/* pin)
#   THE RULE: every action pinned below sits on a major that runs the Node 24 runtime, and each
#   is that action's current major as of the bump — not a uniform number, which is why two read
#   v7 and two read v6. They were all on the v4 line, which declares node20, until GitHub put a
#   date on that runtime: runners began defaulting to Node 24 on 2026-06-16, and Node 20 is
#   removed on 2026-09-23. A node20 action would then fail in "Prepare all required actions" —
#   before any step runs, and in every job at once, since all four check out. See
#   https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
#
#   BEFORE MOVING A MAJOR, read that action's release notes for EVERY major you skip, and check
#   each documented change against the inputs the step below actually passes. That is the whole
#   procedure; the bump itself is a one-word edit and is not the risky part.
#
#   THE TRADE-OFF, STATED HONESTLY. A bare major is a MOVING ref: the tag is repointed over
#   time, so this file can run different action code tomorrow with no commit here. That IS the
#   thing the ARCHI_VERSION policy below refuses to accept, and the objection applies equally
#   here — a repointed tag can turn a lane red with no change on our side, which is exactly the
#   "red no longer means a regression" failure the header warns about. It is accepted, not
#   dodged, because the alternative (a commit SHA per pin) stops tracking the runtime and this
#   file's whole problem is a runtime with an expiry date. The asymmetry is therefore a choice
#   about WHO bears the drift: Archi is the thing under test and must not move underneath us;
#   these actions are the harness, and a harness that silently ages out is the worse failure.
#   IF A LANE GOES RED WITH NO DIFF, SUSPECT A REPOINTED TAG FIRST and check the action's
#   releases page before hunting in this repository.
#
#   Two inputs whose behaviour is version-sensitive, checked at this bump and worth re-checking
#   at the next one:
#     * upload-artifact grew an `archive` input, and `archive: false` accepts a SINGLE file.
#       Both upload steps pass a wildcard resolving to many surefire XML files, so it must stay
#       unset (its default is true). Setting it would fail the upload, not silently skip it.
#     * setup-java's own `cache:` input is unused here — ~/.m2 is cached by a separate
#       actions/cache step — which is why that action's cache-related changes across majors
#       (the wrapper/dependency cache split) reach nothing in this file. It is passed
#       `distribution` and `java-version`, and nothing else.
#
# ARCHI VERSION POLICY  (read before bumping)
#   `ARCHI_VERSION` below is the SINGLE source of truth and is PINNED on purpose.
#   CI that gates merges must be reproducible: the same commit must produce the
#   same result tomorrow. We deliberately do NOT auto-fetch "latest Archi" —
#   a third-party release could turn the build red with no change on our side,
#   and the cache would thrash.
#     * To TEST a future Archi (e.g. 5.10.0 once it is published) with ZERO file
#       edits: run this workflow via "Run workflow" (workflow_dispatch) and type
#       the version into the `archi_version` input.
#     * To ADOPT it permanently once green: change the one `ARCHI_VERSION` line.
#   Current public latest is 5.10.0, published 2026-09-03, and it is what is pinned.
#
#   TWO THINGS TO KNOW BEFORE THE NEXT BUMP.
#     1. The release TAG is not the version string. 5.10.0 is tagged `5_10_0` while its
#        assets keep the dots. The download step tries both forms and names both on failure.
#     2. Only ONE release is presently published on that repo. The 5.9.0 URL this file used
#        to pin now 404s, so the previous pin survived solely on a warm Actions cache and
#        would have gone red, with no change on our side, the moment that cache was evicted.
#        A pin is only reproducible while the artefact it names is still downloadable —
#        if this job starts failing at the download step, check the releases page first.
#
#   5.10.0 changed a model API we call: ArchimateModelUtils.getValidRelationships returns
#   List<EClass> where 5.9.0 returned EClass[]. The one call site is written against neither
#   — it composes the same result from getRelationsClasses + isValidRelationship, whose
#   signatures are identical in both — so this project compiles against either. Verified by
#   running the full two-lane gate against a real 5.10.0 build before this bump landed.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      archi_version:
        description: "Archi version to provision (blank = repo default ARCHI_VERSION). Use to test a new Archi release with no file edits."
        required: false
        default: ""

# Least privilege: read the code. The summary is written to the job summary tab (no separate
# check run), so no `checks: write` is needed.
permissions:
  contents: read

env:
  # ---- SINGLE SOURCE OF TRUTH for the pinned Archi version (see policy header) ----
  ARCHI_VERSION: "5.10.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lane 1 — ci-junit : the headless pure-JUnit bucket (ACTIVE)
  # ===========================================================================
  ci-junit:
    name: ci-junit (headless harness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The harness needs `zip` to strip prod.jar directory entries so
      # getResourceAsStream-on-a-directory matches a deployed bundle. Without it
      # the harness prints "WARN: 'zip' not found" and resource semantics diverge.
      # ubuntu-latest usually ships zip; ensure it deterministically anyway.
      - name: Ensure zip is installed (resource-semantics parity)
        run: command -v zip >/dev/null || { sudo apt-get update && sudo apt-get install -y zip; }

      # Resolve the effective Archi version: workflow_dispatch input wins, else the
      # pinned env default. One place downstream steps + cache keys read from.
      - name: Resolve Archi version
        id: archi
        env:
          INPUT_VERSION: ${{ github.event.inputs.archi_version }}
          DEFAULT_VERSION: ${{ env.ARCHI_VERSION }}
        run: |
          VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Provisioning Archi $VERSION"

      # Cache the extracted Archi distribution, keyed on the version so
      # a bump auto-busts it. A warm run restores ~/archi-dist and skips the ~166 MB
      # download below (the `if: cache-hit != true` guard).
      - name: Cache Archi distribution
        id: cache-archi
        uses: actions/cache@v6
        with:
          path: ~/archi-dist
          key: archi-${{ runner.os }}-${{ steps.archi.outputs.version }}

      - name: Download + extract Archi (cache miss only)
        if: steps.cache-archi.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.archi.outputs.version }}
        run: |
          set -euo pipefail
          # The release TAG is not the version string. 5.10.0 is tagged `5_10_0` while its
          # asset keeps the dots (Archi-Linux64-5.10.0.tgz); earlier releases were tagged with
          # dots. Try the underscore form first, then the dotted one, and name both if neither
          # resolves -- a bare 404 here reads like a network fault rather than a tag rename.
          mkdir -p ~/archi-dist
          downloaded=""
          for TAG in "${VERSION//./_}" "${VERSION}"; do
            URL="https://github.com/archimatetool/archi.io/releases/download/${TAG}/Archi-Linux64-${VERSION}.tgz"
            echo "Trying $URL"
            if curl -fsSL --retry 3 -o /tmp/archi.tgz "$URL"; then downloaded="$URL"; break; fi
          done
          [ -n "$downloaded" ] || {
            echo "::error::Archi ${VERSION} not downloadable. Tried tags '${VERSION//./_}' and '${VERSION}' at github.com/archimatetool/archi.io/releases — check the tag name and that a Linux64 tgz asset exists for this version."
            exit 1
          }
          echo "Downloaded $downloaded"
          tar xzf /tmp/archi.tgz -C ~/archi-dist
          rm -f /tmp/archi.tgz

      # ARCHI_HOME is the dir containing plugins/ (Linux layout: <extract>/Archi).
      - name: Locate ARCHI_HOME
        id: archihome
        run: |
          set -euo pipefail
          plugins_dir="$(find "$HOME/archi-dist" -maxdepth 3 -type d -name plugins | head -1)"
          [ -n "$plugins_dir" ] || { echo "::error::no plugins/ dir found under ~/archi-dist (corrupt or empty Archi cache?)"; exit 1; }
          ARCHI_HOME="$(dirname "$plugins_dir")"
          [ -d "$ARCHI_HOME/plugins" ] || { echo "::error::ARCHI_HOME/plugins not found under ~/archi-dist"; exit 1; }
          echo "ARCHI_HOME=$ARCHI_HOME" >> "$GITHUB_ENV"
          echo "Archi plugin jars: $(find "$ARCHI_HOME/plugins" -name '*.jar' | wc -l) (ARCHI_HOME=$ARCHI_HOME)"

      # Cache ~/.m2, keyed on the pinned-coordinate pom so a pin change busts it.
      - name: Cache Maven repository (Mockito + JUnit/Hamcrest)
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('tools/ci/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      # Populate ~/.m2 with the version-pinned Mockito stack + JUnit/Hamcrest, then
      # provision an ECLIPSE_HOME/plugins dir holding the JUnit/Hamcrest jars under the
      # Eclipse OSGi-qualified names the harness globs (org.junit_4*.jar / org.hamcrest_*.jar).
      # The glob is satisfied by provisioning Eclipse-named jars, so tools/run-tests.sh stays
      # BYTE-IDENTICAL to the macOS dev box. Maven-Central names (junit-4.13.2.jar) would
      # NOT match the glob — hence the copy-and-rename.
      - name: Provision test dependencies (Mockito + Eclipse-named JUnit/Hamcrest)
        id: deps
        run: |
          set -euo pipefail
          mvn -q -B -f tools/ci/pom.xml dependency:go-offline
          M2="$HOME/.m2/repository"
          ECLIPSE_HOME="$RUNNER_TEMP/eclipse-junit"
          mkdir -p "$ECLIPSE_HOME/plugins"
          # Copy + rename to the Eclipse OSGi-qualified pattern the harness globs (run-tests.sh:80-83).
          cp "$M2/junit/junit/4.13.2/junit-4.13.2.jar"            "$ECLIPSE_HOME/plugins/org.junit_4.13.2.jar"
          cp "$M2/org/hamcrest/hamcrest/3.0/hamcrest-3.0.jar"     "$ECLIPSE_HOME/plugins/org.hamcrest_3.0.0.jar"
          echo "ECLIPSE_HOME=$ECLIPSE_HOME" >> "$GITHUB_ENV"
          ls -1 "$ECLIPSE_HOME/plugins"

      # Run the harness UNMODIFIED. The script auto-discovers
      # every *Test.java (minus tools/osgi-excluded-tests.txt) and emits surefire XML; its exit
      # code IS the gate (non-zero on any non-quarantined failure or a testsRun==0 violation).
      #
      # SECURITY-REGRESSION-READY: because the harness auto-discovers *Test.java, the security
      # regression test will be picked up and run here with ZERO edits to this workflow the
      # moment it lands.
      #
      # NOTE: no -XstartOnFirstThread / no --swt / no xvfb — the Linux default path is exactly the
      # no-display pure-JUnit bucket. Do not swallow the exit code (no `|| true`).
      # `tee` to a log for the summary step; `set -eo pipefail` makes a non-zero harness exit
      # fail THIS step (pipefail picks it up over tee's 0) — the exit code remains the sole gate.
      # Do not swallow it (no `|| true`).
      - name: Run headless test harness
        run: |
          set -euo pipefail
          ARCHI_HOME="$ARCHI_HOME" \
          ECLIPSE_HOME="$ECLIPSE_HOME" \
          M2_REPO="$HOME/.m2/repository" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/test-harness" \
          RESULTS_DIR="$GITHUB_WORKSPACE/build/test-results" \
          bash tools/run-tests.sh | tee "$RUNNER_TEMP/harness.log"

      # Publish the surefire XML as an artifact even when the suite is red.
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml
          path: build/test-results/*.xml
          if-no-files-found: warn

      # Human-readable summary on the run's own (correctly green/red) job, via the job
      # summary tab — NOT a separate check run. A third-party XML reporter (e.g. mikepenz) would
      # mark its OWN check failure on the quarantined pins (tools/known-failing-tests.txt), which
      # are emitted to XML as failing but are NON-gating — that false-red check would violate
      # The suite must not go red merely because a class is quarantined. The harness's own output
      # already labels [KNOWN] (quarantined) vs real failures and prints the authoritative
      # SUMMARY/RESULT lines, so we surface those. The job's red/green is the harness exit code.
      - name: Test summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/harness.log"
          {
            echo "### ci-junit — headless harness results"
            echo ""
            if [ -f "$LOG" ]; then
              echo '```'
              grep -E '^SUMMARY:|^KNOWN-FAILING|^RESULT:' "$LOG" || echo "(no summary lines — see the step log)"
              echo '```'
              echo ""
              echo "Quarantined (non-gating, tools/known-failing-tests.txt):"
              echo '```'
              grep -E '^\[KNOWN' "$LOG" || echo "(none)"
              echo '```'
            else
              echo "_Harness log not found — the suite likely failed to compile; see the run step log._"
            fi
            echo ""
            echo "_Full surefire XML is attached as the \`junit-xml\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Lane 2 — ci-pde : the SWT-display bucket under xvfb  (ACTIVE — Group B)
  # ---------------------------------------------------------------------------
  # Runs the display-required classes from tools/osgi-excluded-tests.txt ("Group B"
  # block) that ci-junit cannot: they need a live SWT Display (NOT an OSGi platform).
  # The class list is DERIVED from that manifest block at run time (see the run step)
  # so this lane cannot drift from the set ci-junit subtracts. The mechanism is the
  # SAME harness (tools/run-tests.sh), UNMODIFIED, in explicit-FQCN mode, wrapped
  # in `xvfb-run` so SWT binds to a virtual display. `--swt` is a macOS-only no-op (it
  # just adds -XstartOnFirstThread), so it is NOT passed here — on Linux the display
  # comes from xvfb, not a JVM flag.
  #
  # The "Group A" OSGi/Archi-runtime classes in the manifest are DEFERRED: the
  # provisioned Archi RCP ships no PDE JUnit runtime bundles, so a headless
  # coretestapplication would need extra bundle provisioning that was judged not
  # worth it; those stay owner-gated via the Eclipse AllPluginTestsRunner.
  #
  # Reuses ci-junit's Archi + ~/.m2 provisioning with the SAME cache keys, so the
  # ~166 MB Archi tarball and the Mockito/JUnit stack are not re-fetched.
  # ===========================================================================
  ci-pde:
    name: ci-pde (display bucket under xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The display trio recompiles prod from source and packages prod.jar; `zip`
      # strips its directory entries for resource-semantics parity (as in ci-junit).
      # `xvfb` provides the virtual framebuffer the SWT Display binds to. The
      # `apt-get update` is unconditional (not guarded like ci-junit's zip check):
      # xvfb is never pre-installed on ubuntu-latest, so the index refresh is
      # always required before the install can resolve it.
      - name: Install xvfb + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zip

      # Resolve the effective Archi version: workflow_dispatch input wins, else the
      # pinned env default (same single source of truth as ci-junit).
      - name: Resolve Archi version
        id: archi
        env:
          INPUT_VERSION: ${{ github.event.inputs.archi_version }}
          DEFAULT_VERSION: ${{ env.ARCHI_VERSION }}
        run: |
          VERSION="${INPUT_VERSION:-$DEFAULT_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Provisioning Archi $VERSION"

      # SAME cache key as ci-junit so a warm run restores ~/archi-dist and
      # skips the ~166 MB download (the `if: cache-hit != true` guard below).
      - name: Cache Archi distribution
        id: cache-archi
        uses: actions/cache@v6
        with:
          path: ~/archi-dist
          key: archi-${{ runner.os }}-${{ steps.archi.outputs.version }}

      - name: Download + extract Archi (cache miss only)
        if: steps.cache-archi.outputs.cache-hit != 'true'
        env:
          VERSION: ${{ steps.archi.outputs.version }}
        run: |
          set -euo pipefail
          # The release TAG is not the version string. 5.10.0 is tagged `5_10_0` while its
          # asset keeps the dots (Archi-Linux64-5.10.0.tgz); earlier releases were tagged with
          # dots. Try the underscore form first, then the dotted one, and name both if neither
          # resolves -- a bare 404 here reads like a network fault rather than a tag rename.
          mkdir -p ~/archi-dist
          downloaded=""
          for TAG in "${VERSION//./_}" "${VERSION}"; do
            URL="https://github.com/archimatetool/archi.io/releases/download/${TAG}/Archi-Linux64-${VERSION}.tgz"
            echo "Trying $URL"
            if curl -fsSL --retry 3 -o /tmp/archi.tgz "$URL"; then downloaded="$URL"; break; fi
          done
          [ -n "$downloaded" ] || {
            echo "::error::Archi ${VERSION} not downloadable. Tried tags '${VERSION//./_}' and '${VERSION}' at github.com/archimatetool/archi.io/releases — check the tag name and that a Linux64 tgz asset exists for this version."
            exit 1
          }
          echo "Downloaded $downloaded"
          tar xzf /tmp/archi.tgz -C ~/archi-dist
          rm -f /tmp/archi.tgz

      # ARCHI_HOME is the dir containing plugins/ (Linux layout: <extract>/Archi).
      - name: Locate ARCHI_HOME
        id: archihome
        run: |
          set -euo pipefail
          plugins_dir="$(find "$HOME/archi-dist" -maxdepth 3 -type d -name plugins | head -1)"
          [ -n "$plugins_dir" ] || { echo "::error::no plugins/ dir found under ~/archi-dist (corrupt or empty Archi cache?)"; exit 1; }
          ARCHI_HOME="$(dirname "$plugins_dir")"
          [ -d "$ARCHI_HOME/plugins" ] || { echo "::error::ARCHI_HOME/plugins not found under ~/archi-dist"; exit 1; }
          echo "ARCHI_HOME=$ARCHI_HOME" >> "$GITHUB_ENV"
          echo "Archi plugin jars: $(find "$ARCHI_HOME/plugins" -name '*.jar' | wc -l) (ARCHI_HOME=$ARCHI_HOME)"

      # SAME cache key as ci-junit, keyed on the pinned-coordinate pom.
      - name: Cache Maven repository (Mockito + JUnit/Hamcrest)
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('tools/ci/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      # Provision the same Mockito stack + Eclipse-named JUnit/Hamcrest glob the
      # harness reads — identical to ci-junit so tools/run-tests.sh stays unmodified.
      - name: Provision test dependencies (Mockito + Eclipse-named JUnit/Hamcrest)
        id: deps
        run: |
          set -euo pipefail
          mvn -q -B -f tools/ci/pom.xml dependency:go-offline
          M2="$HOME/.m2/repository"
          ECLIPSE_HOME="$RUNNER_TEMP/eclipse-junit"
          mkdir -p "$ECLIPSE_HOME/plugins"
          cp "$M2/junit/junit/4.13.2/junit-4.13.2.jar"            "$ECLIPSE_HOME/plugins/org.junit_4.13.2.jar"
          cp "$M2/org/hamcrest/hamcrest/3.0/hamcrest-3.0.jar"     "$ECLIPSE_HOME/plugins/org.hamcrest_3.0.0.jar"
          echo "ECLIPSE_HOME=$ECLIPSE_HOME" >> "$GITHUB_ENV"
          ls -1 "$ECLIPSE_HOME/plugins"

      # The display classes via the UNMODIFIED harness in explicit-FQCN mode, wrapped
      # in `xvfb-run` so SWT binds to a virtual display. DISTINCT BUILD_DIR/RESULTS_DIR
      # so this lane's artifacts never collide with ci-junit's. The harness exit code
      # is the sole gate (no `|| true`); `set -euo pipefail` propagates a non-zero
      # harness exit over tee's 0. An explicit 24-bit screen geometry makes the virtual
      # display deterministic across runner images (some default to a depth GEF/SWT
      # image ops dislike).
      #
      # The class list is DERIVED from tools/osgi-excluded-tests.txt at run time — the
      # FQCNs under the "# --- Group B" header, up to the next "# --- Group" header —
      # so it is impossible for this lane to drift from the manifest ci-junit subtracts.
      # A class added to the manifest's Group B is picked up here with no edit to this
      # workflow. Fail loudly if the parse yields nothing (a malformed manifest must not
      # silently run zero display tests and pass).
      - name: Run SWT-display bucket under xvfb
        run: |
          set -euo pipefail
          mapfile -t GROUP_B < <(
            awk '/^# --- Group B/{g=1; next} /^# --- Group/{g=0} g && $1 !~ /^#/ && NF {print $1}' \
              tools/osgi-excluded-tests.txt
          )
          [ "${#GROUP_B[@]}" -gt 0 ] || { echo "::error::no Group B (display) classes parsed from tools/osgi-excluded-tests.txt"; exit 1; }
          printf 'Display-required class (from manifest Group B): %s\n' "${GROUP_B[@]}"
          ARCHI_HOME="$ARCHI_HOME" \
          ECLIPSE_HOME="$ECLIPSE_HOME" \
          M2_REPO="$HOME/.m2/repository" \
          BUILD_DIR="$GITHUB_WORKSPACE/build/test-harness-pde" \
          RESULTS_DIR="$GITHUB_WORKSPACE/build/test-results-pde-display" \
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bash tools/run-tests.sh "${GROUP_B[@]}" \
            | tee "$RUNNER_TEMP/harness-pde.log"

      # Publish the surefire XML even when the suite is red. DISTINCT
      # artifact name (junit-xml-pde) — same name as ci-junit's would collide.
      - name: Upload JUnit XML (display bucket)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-xml-pde
          path: build/test-results-pde-display/*.xml
          if-no-files-found: warn

      # Human-readable summary on the job's own (correctly green/red) summary
      # tab — NOT a separate check run (a separate check run reports false red). The job's red/green
      # is the harness exit code. Group B runs explicit FQCNs (no manifest scan, no
      # quarantine), so there are no [KNOWN] lines to surface.
      - name: Test summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/harness-pde.log"
          {
            echo "### ci-pde — display bucket (xvfb) results"
            echo ""
            echo "_Group B (SWT-display classes, derived from tools/osgi-excluded-tests.txt) via the unmodified harness under xvfb._"
            echo "_Group A (OSGi/Archi-runtime classes) is deferred — owner-gated via the Eclipse AllPluginTestsRunner._"
            echo ""
            if [ -f "$LOG" ]; then
              echo '```'
              grep -E '^SUMMARY:|^RESULT:|^\[(ok|FAIL)' "$LOG" || echo "(no summary lines — see the step log)"
              echo '```'
            else
              echo "_Harness log not found — the suite likely failed to compile; see the run step log._"
            fi
            echo ""
            echo "_Full surefire XML is attached as the \`junit-xml-pde\` artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Lane 3 — ci-ratchet : the god-object no-growth pawl (ACTIVE)
  # ===========================================================================
  # ArchiModelAccessorImpl is a thick orchestration facade being decomposed
  # cluster-by-cluster behind its unchanged interface. This lane is a pure shell
  # guard — no Archi, no JDK, no display — that fails the build if the facade
  # grows (LOC / public surface) or if the ArchiModelAccessor interface signature
  # drifts from the committed baseline. A guideline can slip; a ratchet cannot.
  # The ceilings can only ever be lowered (in the same PR that shrinks the file).
  ci-ratchet:
    name: ci-ratchet (god-object no-growth pawl)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce size + interface-signature ratchet
        run: bash tools/size-ratchet.sh

  # ===========================================================================
  # Lane 4 — ci-sync : a generated copy still matches its source (ACTIVE)
  # ===========================================================================
  # .claude/commands/{drawio,repo}-to-archi.md are SELF-CONTAINED COPIES of
  # prompts/{drawio,repo}-to-archimate-model.md, produced by tools/sync-{drawio,repo}-command.sh
  # over the shared harness in tools/lib/sync-command.sh.
  # It cannot be a pointer: a slash command has to work without this repository
  # present. Two copies of one document drift, and a drifted copy is worse than no
  # copy, because the user runs the command believing it matches the prompt they
  # reviewed.
  #
  # The script has carried a --check mode built for exactly this since it was
  # written, and nothing ever called it. Measured: an edit to the source prompt on
  # 2026-08-25 left the generated copy stale for 55 commits and eight days, on main,
  # with no signal anywhere — it was found by accident when an unrelated change
  # happened to re-run the script and swept the drift into its own diff. Re-syncing
  # by hand is the step that gets skipped; that is why the script exists, and it is
  # equally why calling it has to be mechanical rather than a convention.
  #
  # Pure shell, no build. Kept a SEPARATE check from ci-ratchet rather than a second
  # step inside it: a stale document and a grown facade are unrelated failures, and
  # folding them into one red check makes each easier to dismiss as "the other one".
  ci-sync:
    name: ci-sync (generated copies match their source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Exit 1 when the copy is stale. The remedy is in the failure output: run
      # tools/sync-drawio-command.sh and commit the regenerated file — never hand-edit
      # the copy, which would drift again on the next regeneration.
      #
      # THIS LANE IS A NO-OP ON THE PUBLISHED REPOSITORY, AND THAT IS DELIBERATE — it is not
      # a guard that has quietly stopped working. `.claude/` is culled wholesale at publish
      # time while this workflow and prompts/ both ship, so a published checkout carries the
      # SOURCE and can never carry the copy. The check asserted a condition the publish step
      # guarantees false, and this lane was the ONLY red one on the v1.9.0 public push
      # (run 34142915315; ci-junit, ci-pde and ci-ratchet all green). The script now reports
      # NOT APPLICABLE when the `.claude/` tree is absent ENTIRELY, and still fails whenever
      # that tree exists and the copy is missing or drifted — which is every run in the
      # repository where the copy actually lives, i.e. the only place drift can occur.
      # Both command copies, as separate steps so the failure names which one drifted.
      - name: Verify the drawio-to-archi copy matches its source prompt
        run: bash tools/sync-drawio-command.sh --check

      - name: Verify the repo-to-archi copy matches its source prompt
        run: bash tools/sync-repo-command.sh --check
